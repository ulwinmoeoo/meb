<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--f:"Plus Jakarta Sans","Noto Sans Myanmar","Noto Sans Thai","Padauk","Myanmar Text",system-ui,sans-serif;--bg:#f6f7f6;--s:#fff;--ink:#14201e;--mut:#6b7c79;--line:#e0e7e5;--p:#0b5d55;--on:#fff;--g:#f2b705;--bad:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1716;--s:#15221f;--ink:#e9f3f1;--mut:#8fa8a4;--line:#26393a;--p:#3cd0be;--on:#06201d;--bad:#ff8f84;color-scheme:dark}}
*{box-sizing:border-box}.hide,[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f);font-variant-numeric:tabular-nums}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--g);color:#2a2000;font:800 .72rem var(--f)}
.bar{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
.brand{display:flex;gap:9px;align-items:center;font-weight:700}.brand small{color:var(--mut);font-weight:500}
main{max-width:760px;margin:0 auto;padding:0 14px 28px}
h1{margin:6px 0 2px;font-size:1.25rem}.hint{color:var(--mut);font-size:.8rem;margin:2px 0 8px}
.tabs{max-width:760px;margin:6px auto 12px;padding:0 14px;display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;font:600 .92rem var(--f);color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs .on{color:var(--p);border-color:var(--p)}
.tabs i,.cnt{font-style:normal;display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;font:700 .7rem/18px var(--f);text-align:center;background:var(--line);color:var(--ink)}
.tabs i{margin-left:6px}.tabs i:empty{display:none}.cnt.hot,.tabs i{background:var(--g);color:#2a2000}
label{display:block;font-size:.76rem;color:var(--mut);margin:10px 0 3px}
input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--s);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:0;border-color:var(--p)}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--p);color:var(--on);font:700 .9rem var(--f);cursor:pointer}
.btn.full{width:100%;margin-top:14px;padding:12px}.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.ghost{border:1px solid var(--line);background:var(--s);color:var(--ink);padding:5px 11px;border-radius:9px;font:inherit;font-size:.82rem;cursor:pointer}
.bar .ghost{display:inline-flex;align-items:center;gap:4px}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}.gate>div:last-child{width:100%;max-width:340px}
.gate .box{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:18px}.gate .lgbox{position:fixed;top:12px;right:12px;z-index:30}
.lgbox{position:relative}.fl{font-size:1.05rem;line-height:1}
.lgm{position:absolute;right:0;top:calc(100% + 6px);background:var(--s);border:1px solid var(--line);border-radius:12px;padding:4px;min-width:140px;z-index:30;box-shadow:0 10px 26px -12px rgba(0,0,0,.35)}
.lgm button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}.lgm button:hover{background:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.chips button{position:relative;border:1px solid var(--line);background:var(--s);color:var(--mut);padding:5px 13px;border-radius:99px;font:inherit;font-size:.86rem;cursor:pointer}
.chips .on{background:var(--p);border-color:var(--p);color:var(--on);font-weight:700}
.chips .cnt{position:absolute;top:-9px;right:-5px;height:17px;line-height:17px;min-width:17px;font-size:.66rem;border:1.5px solid var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.stat span{font-size:.74rem;color:var(--mut)}.stat b{display:block;font:800 1.2rem var(--f)}
.days{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--s)}
.days table{width:100%;border-collapse:collapse;font-size:.82rem;white-space:nowrap}
.days th{color:var(--mut);font-weight:600;font-size:.72rem;text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}
.days td{text-align:right;padding:7px 10px;border-top:1px solid var(--line)}
.days th:first-child,.days td:first-child{text-align:left;position:sticky;left:0;background:var(--s)}
.oc{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.oh time{margin-left:auto;color:var(--mut);font-size:.76rem}
.flow{display:flex;align-items:baseline;gap:8px;margin:6px 0;font:800 1.1rem var(--f)}.flow i{font-style:normal;font-size:.74rem;color:var(--mut)}.flow em{color:var(--mut);font-style:normal}.flow .rx{color:var(--p)}
.meta{margin:2px 0;color:var(--mut);font-size:.86rem;word-break:break-word}.meta b,.meta a{color:var(--ink)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.acts .btn,.acts .ghost{padding:7px 12px;font-size:.84rem}
.mini{border:0;background:var(--bg);color:var(--p);padding:0 8px;border-radius:7px;font:inherit;font-size:.74rem;cursor:pointer}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-weight:700;font-size:.78rem}
.pending{background:#fff1cf;color:#7a5200}.done{background:#d3f2e3;color:#0a5c3a}.rejected{background:#fcdcd9;color:#8a1c14}
.pt img{height:64px;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin-top:6px}
.qrrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.qrrow img{height:90px;border-radius:8px;border:1px solid var(--line);background:#fff}.qrrow small{color:var(--mut)}.qrrow .ghost{margin:0;color:var(--ink)}
.swal2-popup{font-family:var(--f)}.sw{color:var(--mut);margin:6px 0}code{word-break:break-all;font-size:.85rem}
</style>
</head>

<div id="login" class="gate"><div class="lgbox"></div><div><div class="box">
 <span class="mark">฿K</span><h1>Admin</h1><p class="hint" data-i="lh"></p>
 <label>Email</label><input id="em" type="email" autocomplete="username">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">

</div></div></div>

<div id="app" class="hide">

 <main>
  <section id="po">
   <div class="row"><div class="chips" id="flt">
    <button data-f="pending" class="on"><span data-i="pending"></span><i class="cnt hot" id="n_pending">0</i></button>
    <button data-f="done"><span data-i="done"></span><i class="cnt" id="n_done">0</i></button>
    <button data-f="rejected"><span data-i="rejected"></span><i class="cnt" id="n_rejected">0</i></button>
    <button data-f="all"><span data-i="all"></span><i class="cnt" id="n_all">0</i></button></div>
    <button class="ghost" id="rf">↻</button></div>
   <div id="list"></div>
  </section>
  <section id="ps" hidden>
   <div class="chips" id="qd"><button data-q="0" class="on" data-i="today"></button><button data-q="1" data-i="yday"></button><button data-q="7" data-i="d7"></button><button data-q="m" data-i="month"></button></div>
   <div class="two"><div><label data-i="from"></label><input id="d1" type="date"></div><div><label data-i="to"></label><input id="d2" type="date"></div></div>
   <p class="hint" id="sh" style="margin-top:10px"></p>
   <div class="grid" id="sum"></div><div id="days"></div></section>
  <section id="pr" hidden><p class="hint" data-i="per"></p><p class="hint" id="rt_up"></p>
   <div class="grid">
    <div><label data-i="border"></label><input id="r_e" type="number" step="any"></div>
    <div><label data-i="give"></label><input id="r_a" type="number" step="any"></div>
    <div><label data-i="take"></label><input id="r_b" type="number" step="any"></div>
    <div><label data-i="minmmk"></label><input id="r_f" type="number" step="any"></div>
   </div>
   <label data-i="accTHB"></label><textarea id="r_c" rows="2"></textarea>
   <label data-i="accMMK"></label><textarea id="r_d" rows="2"></textarea>
   <label data-i="rulesLbl"></label><textarea id="r_g" rows="3"></textarea>
   <label data-i="qrThb"></label>
   <div class="qrrow"><img id="qi_thb" alt="" hidden><small id="qn_thb"></small><label class="ghost" for="qf_thb" data-i="qrUp"></label><input id="qf_thb" type="file" accept="image/*" hidden></div>
   <label data-i="qrMmk"></label>
   <div class="qrrow"><img id="qi_mmk" alt="" hidden><small id="qn_mmk"></small><label class="ghost" for="qf_mmk" data-i="qrUp"></label><input id="qf_mmk" type="file" accept="image/*" hidden></div>
   <button class="btn full" id="sv" data-i="save"></button>
  </section>
 </main>
</div>

let L='my';try{const s=localStorage.getItem('alang');if(LG[s])L=s}catch(e){}
const t=(k,n)=>String(I[k][LG[L].i]).replace('{n}',n??'');

const $=id=>document.getElementById(id),qa=s=>document.querySelectorAll(s);
const fmt=n=>Number(n).toLocaleString('en',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(icon,title)=>S.fire({toast:true,position:'top',icon,title,timer:1800,showConfirmButton:false});
const copy=x=>{navigator.clipboard?.writeText(x);toast('success',t('copied'))};
const rnd=()=>Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');
let F='pending',RT=null;

function mountLang(){
 qa('.lgbox').forEach(b=>{
  b.innerHTML=`<button class="ghost" type="button"><span class="fl"></span><span>▾</span></button><div class="lgm" hidden>${Object.entries(LG).map(([k,v])=>`<button type="button" data-l="${k}"><span class="fl">${v.f}</span>${v.n}</button>`).join('')}</div>`;
  const m=b.querySelector('.lgm');
  b.firstElementChild.onclick=e=>{e.stopPropagation();const o=m.hidden;qa('.lgm').forEach(x=>x.hidden=true);m.hidden=!o};
  m.onclick=e=>{const x=e.target.closest('[data-l]');if(x)setLang(x.dataset.l)};
 });
 document.addEventListener('click',()=>qa('.lgm').forEach(m=>m.hidden=true));
}
function setLang(l){L=l;try{localStorage.setItem('alang',l)}catch(e){}
 document.documentElement.lang=l;qa('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 qa('.lgbox>button .fl').forEach(e=>e.textContent=LG[l].f);qa('.lgm').forEach(m=>m.hidden=true);
 if(RT)showQrPrev(RT);
 if(!$('app').classList.contains('hide')){loadOrders();loadSummary()}}

async function compress(f,m=1400,q=.82){try{const bm=await createImageBitmap(f),k=Math.min(1,m/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',q))}catch(e){return f}}

/* ---------- login + 2-step ---------- */
async function login(){
 const email=$('em').value.trim(),password=$('pw').value;if(!email||!password)return;
 $('lb').disabled=true;
 try{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await gate()}
 catch(e){S.fire({icon:'error',title:t('loginFail'),text:e.message})}
 finally{$('lb').disabled=false}
}
async function gate(){
 const {data:s}=await db.auth.getSession();if(!s.session)return;
 const {data:a}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
 if(a.currentLevel!=='aal2'){
  const {data:f}=await db.auth.mfa.listFactors(),tf=(f.totp||[])[0];
  const ok=tf?await ask(tf.id,'',t('tfa')):await enroll(f);
  if(!ok)return;
 }
 start();
}
async function ask(factorId,html,title,onOpen){
 for(;;){
  const r=await S.fire({title,html,input:'text',inputAttributes:{inputmode:'numeric',maxlength:6,autocomplete:'one-time-code'},inputPlaceholder:'000000',
   confirmButtonText:t('verify'),showCancelButton:true,cancelButtonText:t('logout'),allowOutsideClick:false,didOpen:onOpen,
   inputValidator:v=>/^\d{6}$/.test((v||'').trim())?undefined:t('code6')});
  if(r.isDismissed){await db.auth.signOut();location.reload();return false}
  const {error}=await db.auth.mfa.challengeAndVerify({factorId,code:r.value.trim()});
  if(!error)return true;
  await S.fire({icon:'error',title:t('wrongCode'),text:error.message,timer:2000,showConfirmButton:false});
 }
}
async function enroll(f){
 for(const x of (f.all||[]).filter(x=>x.status!=='verified'))await db.auth.mfa.unenroll({factorId:x.id});
 const {data,error}=await db.auth.mfa.enroll({factorType:'totp',friendlyName:'admin-'+Date.now()});
 if(error){await S.fire({icon:'error',title:t('tfaFail'),text:error.message});return false}
 const html=`<p class="sw">${t('tfaScan')}</p><img id="qr" width="190" height="190" alt="QR"><p class="sw">${t('tfaKey')}<br><code>${esc(data.totp.secret)}</code></p>`;
 return ask(data.id,html,t('tfaSetup'),()=>{$('qr').src=data.totp.qr_code});
}
function start(){$('login').classList.add('hide');$('app').classList.remove('hide');loadRates();refresh()}
async function refresh(){await Promise.all([loadOrders(),loadSummary(),loadCounts()])}
async function loadCounts(){
 const st=['pending','done','rejected'];
 const r=await Promise.all(st.map(x=>db.from('orders').select('id',{count:'exact',head:true}).eq('status',x)));
 const c={};st.forEach((x,i)=>c[x]=r[i].count||0);c.all=c.pending+c.done+c.rejected;
 for(const k in c)$('n_'+k).textContent=c[k];
 $('c_p').textContent=c.pending||''}

/* ---------- rates ---------- */
async function loadRates(){
 const {data}=await db.from('rates').select('*').eq('id',1).single();if(!data)return;
 RT=data;showQrPrev(data);
 $('r_a').value=data.give_rate;$('r_b').value=data.take_rate;$('r_e').value=data.border_rate;$('r_f').value=data.min_mmk;
 $('r_c').value=data.pay_thb;$('r_d').value=data.pay_mmk;$('r_g').value=data.rules||''}
async function saveRates(){
 const nv={give_rate:+$('r_a').value,take_rate:+$('r_b').value,border_rate:+$('r_e').value},now=new Date().toISOString();
 const ch=!RT||nv.give_rate!==Number(RT.give_rate)||nv.take_rate!==Number(RT.take_rate)||nv.border_rate!==Number(RT.border_rate);
 const {data,error}=await db.from('rates').update({...nv,min_mmk:+$('r_f').value,pay_thb:$('r_c').value,pay_mmk:$('r_d').value,rules:$('r_g').value.trim()||null,
  updated_at:now,...(ch?{rate_updated_at:now}:{})}).eq('id',1).select();
 if(error||!data||!data.length)return S.fire({icon:'error',title:t('failed'),text:error?error.message:t('noPerm')});
 RT=data[0];showQrPrev(RT);toast('success',t('saved'))}

/* ---------- summary ---------- */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function quick(q){const x=new Date(),a=new Date(x);
 if(q==='1')a.setDate(x.getDate()-1);else if(q==='7')a.setDate(x.getDate()-6);else if(q==='m')a.setDate(1);
 $('d1').value=ymd(a);$('d2').value=ymd(q==='1'?a:x)}
async function loadSummary(){
 if(!$('d1').value||!$('d2').value)quick('0');
 let d1=$('d1').value,d2=$('d2').value;if(d1>d2){[d1,d2]=[d2,d1]}
 const from=new Date(d1+'T00:00:00'),to=new Date(d2+'T00:00:00');to.setDate(to.getDate()+1);
 const {data,error}=await db.from('orders').select('direction,send_amount,receive_amount,status,created_at').gte('created_at',from.toISOString()).lt('created_at',to.toISOString()).limit(1000);
 if(error){$('sum').textContent=error.message;return}
 const all=data||[],d=all.filter(o=>o.status==='done');
 const sum=(a,dir,k)=>a.filter(o=>o.direction===dir).reduce((x,o)=>x+Number(o[k]),0);
 $('sh').textContent=(d1===d2?d1:`${d1} → ${d2}`)+' · '+t('shNote')+(all.length>=1000?' '+t('first1000'):'');
 $('sum').innerHTML=[[t('sTotal'),all.length],[t('pending'),all.filter(o=>o.status==='pending').length],[t('done'),d.length],[t('rejected'),all.filter(o=>o.status==='rejected').length],
  [t('rxTHB'),fmt(sum(d,'THB_MMK','send_amount'))],[t('payMMK'),fmt(sum(d,'THB_MMK','receive_amount'))],
  [t('rxMMK'),fmt(sum(d,'MMK_THB','send_amount'))],[t('payTHB'),fmt(sum(d,'MMK_THB','receive_amount'))]
 ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
 if(d1===d2||!d.length){$('days').innerHTML='';return}
 const by={};for(const o of d){const k=ymd(new Date(o.created_at));(by[k]=by[k]||[]).push(o)}
 $('days').innerHTML=`<div class="days"><table><tr><th>${t('colDate')}</th><th>${t('colOrders')}</th><th>${t('thbIn')}</th><th>${t('mmkOut')}</th><th>${t('mmkIn')}</th><th>${t('thbOut')}</th></tr>`+
  Object.keys(by).sort().reverse().map(k=>{const a=by[k];return `<tr><td>${k.slice(5)}</td><td>${a.length}</td><td>${fmt(sum(a,'THB_MMK','send_amount'))}</td><td>${fmt(sum(a,'THB_MMK','receive_amount'))}</td><td>${fmt(sum(a,'MMK_THB','send_amount'))}</td><td>${fmt(sum(a,'MMK_THB','receive_amount'))}</td></tr>`}).join('')+'</table></div>'}

/* ---------- orders ---------- */
async function viewImg(bucket,path){
 const u=bucket==='slips'?(await db.storage.from('slips').createSignedUrl(path,300)).data?.signedUrl:db.storage.from('payouts').getPublicUrl(path).data.publicUrl;
 if(!u)return toast('error',t('slipNone'));
 S.fire({html:'<img id="vi" style="max-width:100%;border-radius:10px" alt="">',didOpen:()=>{$('vi').src=u},showConfirmButton:false,showCloseButton:true})}

async function loadOrders(){
 let q=db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
 if(F!=='all')q=q.eq('status',F);
 const {data,error}=await q;
 if(error){$('list').textContent=error.message;return}
 $('list').innerHTML=data.length?'':`<p class="hint">${t('noOrders')}</p>`;
 for(const o of data){
  const [a,b]=o.direction==='THB_MMK'?['THB','MMK']:['MMK','THB'];
  const el=document.createElement('article');el.className='oc';
  const tm=new Date(o.created_at).toLocaleString(LG[L].loc,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
  const pu=o.payout_slip_path?db.storage.from('payouts').getPublicUrl(o.payout_slip_path).data.publicUrl:'';
  el.innerHTML=`<div class="oh"><b>${esc(o.order_no)}</b><span class="badge ${o.status}">${t(o.status)}</span><time>${tm}</time></div>
   <div class="flow"><span>${fmt(o.send_amount)} <i>${a}</i></span><em>→</em><span class="rx">${fmt(o.receive_amount)} <i>${b}</i></span></div>
   <p class="meta">${esc(o.name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p>
   <p class="meta">${esc(o.receive_method)} · <b>${esc(o.receive_account)||'QR'}</b> ${o.receive_account?`<button class="mini" data-a="cp">${t('copy')}</button>`:''}</p>
   ${o.note?`<p class="meta">${t('note')}: ${esc(o.note)}</p>`:''}
   ${pu?`<div class="pt"><img src="${encodeURI(pu)}" alt="payout slip" data-a="pv" loading="lazy" onerror="this.style.display='none'"></div>`:''}
   <div class="acts"><button class="ghost" data-a="slip">${t('custSlip')}</button>${o.recv_qr_path?`<button class="ghost" data-a="qr">${t('qrBtn')}</button>`:''}
   ${o.status==='pending'?`<button class="btn" data-a="ok">${t('complete')}</button><button class="btn bad" data-a="no">${t('rejectBtn')}</button>`:''}</div>`;
  const on=(k,fn)=>{const e=el.querySelector(`[data-a=${k}]`);if(e)e.onclick=fn};
  on('cp',()=>copy(o.receive_account));on('slip',()=>viewImg('slips',o.slip_path));on('qr',()=>viewImg('slips',o.recv_qr_path));on('pv',()=>viewImg('payouts',o.payout_slip_path));
  on('ok',()=>complete(o));on('no',()=>reject(o));
  $('list').appendChild(el)}
}
async function complete(o){
 const cur=o.direction==='THB_MMK'?'MMK':'THB';
 const {value:v}=await S.fire({title:t('cTitle'),
  html:`<p class="sw">${esc(o.receive_method)} · <b>${esc(o.receive_account)||'QR'}</b><br><b>${fmt(o.receive_amount)} ${cur}</b> — ${t('cBody')}</p><input id="swf" type="file" accept="image/*" class="swal2-file"><textarea id="swn" class="swal2-textarea" placeholder="${esc(t('cNote'))}"></textarea>`,
  showCancelButton:true,confirmButtonText:t('cOk'),cancelButtonText:t('cancel'),
  preConfirm:()=>{const f=$('swf').files[0];if(!f){Swal.showValidationMessage(t('cNeed'));return false}return {f,n:$('swn').value.trim()}}});
 if(!v)return;
 S.fire({title:t('uploading'),allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{
  const b=await compress(v.f),path=`${o.order_no}-${rnd()}.jpg`;
  const up=await db.storage.from('payouts').upload(path,b,{contentType:b.type||'image/jpeg'});
  if(up.error)throw new Error('slip: '+up.error.message);
  const {data,error}=await db.from('orders').update({status:'done',payout_slip_path:path,note:v.n||null}).eq('id',o.id).select();
  if(error||!data.length)throw new Error(error?error.message:t('noPerm'));
  await refresh();toast('success',t('doneToast'));
 }catch(e){S.fire({icon:'error',title:t('failed'),text:e.message})}
}
async function reject(o){
 const r=await S.fire({title:t('rTitle',o.order_no),input:'text',inputPlaceholder:t('rReason'),showCancelButton:true,confirmButtonText:t('rejectBtn'),cancelButtonText:t('cancel'),confirmButtonColor:'#c0392b'});
 if(!r.isConfirmed)return;
 const {data,error}=await db.from('orders').update({status:'rejected',note:(r.value||'').trim()||null}).eq('id',o.id).select();
 if(error||!data.length)return S.fire({icon:'error',title:t('failed'),text:error?error.message:t('noPerm')});
 await refresh();toast('success',t('rDone'))}

const qrUrl=p=>db.storage.from('qr').getPublicUrl(p).data.publicUrl;
function showQrPrev(d){const ru=d.rate_updated_at||d.updated_at;$('rt_up').textContent=ru?t('rtUp')+': '+new Date(ru).toLocaleString(LG[L].loc,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
 ['thb','mmk'].forEach(k=>{const p=d['qr_'+k],im=$('qi_'+k);im.onerror=()=>{im.hidden=true};
 if(p){im.src=qrUrl(p);im.hidden=false;$('qn_'+k).textContent=''}else{im.hidden=true;$('qn_'+k).textContent=t('qrDefault')}})}
async function uploadQR(k,f){
 if(!f)return;
 S.fire({title:t('uploading'),allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{
  const b=await compress(f,1200,.92),path=`${k}-${rnd()}.jpg`;
  const up=await db.storage.from('qr').upload(path,b,{contentType:b.type||'image/jpeg'});
  if(up.error)throw new Error(up.error.message);
  const {data,error}=await db.from('rates').update({['qr_'+k]:path,updated_at:new Date().toISOString()}).eq('id',1).select();
  if(error||!data.length)throw new Error(error?error.message:t('noPerm'));
  const old=RT&&RT['qr_'+k];if(old)db.storage.from('qr').remove([old]);
  RT=data[0];showQrPrev(RT);toast('success',t('qrDone'));
 }catch(e){S.fire({icon:'error',title:t('failed'),text:e.message})}
}
['thb','mmk'].forEach(k=>$('qf_'+k).onchange=e=>{uploadQR(k,e.target.files[0]);e.target.value=''});
$('lb').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('lo').onclick=async()=>{await db.auth.signOut();location.reload()};
$('rf').onclick=refresh;$('sv').onclick=saveRates;
qa('#flt button').forEach(b=>b.onclick=()=>{F=b.dataset.f;qa('#flt button').forEach(x=>x.classList.toggle('on',x===b));loadOrders()});
qa('#qd button').forEach(b=>b.onclick=()=>{qa('#qd button').forEach(x=>x.classList.toggle('on',x===b));quick(b.dataset.q);loadSummary()});
['d1','d2'].forEach(i=>$(i).onchange=()=>{qa('#qd button').forEach(x=>x.classList.remove('on'));loadSummary()});
qa('#tabs button').forEach(b=>b.onclick=()=>{qa('#tabs button').forEach(x=>x.classList.toggle('on',x===b));['po','ps','pr'].forEach(id=>$(id).hidden=id!==b.dataset.p)});
mountLang();setLang(L);gate();
</script>
