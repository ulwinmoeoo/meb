<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a2a;--mut:#667;--line:#ddd8c9;--acc:#0f6b5c;--bad:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121a19;--card:#1b2625;--ink:#eef2ef;--mut:#9aa8a5;--line:#2f3d3b;--acc:#43c0a8;--bad:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
section,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:1.05rem;margin:0 0 8px}
label{display:block;color:var(--mut);font-size:.85rem;margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0b1514}}
button.alt{background:none;border:1px solid var(--line);color:var(--ink)}
button.no{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat b{display:block;font-size:1.3rem}
.hide{display:none}
.badge{padding:1px 9px;border-radius:99px;font-weight:600;font-size:.85rem}
.pending{background:#fff1cf;color:#7a5200}.done{background:#d6f3e6;color:#0a5c3a}.rejected{background:#fcdcd9;color:#8a1c14}
.order img{max-width:100%;max-height:360px;border-radius:8px;margin-top:8px}
.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<section id="login">
 <h2>Admin login</h2>
 <label>Email</label><input id="em" type="email" autocomplete="username">
 <label>Password</label><input id="pw" type="password" autocomplete="current-password">
 <p><button onclick="login()">Login</button></p><div id="lerr" class="err"></div>
</section>

<div id="app" class="hide">
 <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Admin panel</b><button class="alt" onclick="logout()">Logout</button></div>

 <section><h2>ယနေ့ စာရင်းချုပ် (ပြီးစီးပြီးသား)</h2>
  <div class="grid" id="sum"></div></section>

 <section><h2>Rate ပြင်ရန်</h2>
  <div class="grid">
   <div><label>THB 1 လွှဲရင် ရမယ့် MMK</label><input id="r_a" type="number" step="any"></div>
   <div><label>THB 1 ရဖို့ လိုတဲ့ MMK</label><input id="r_b" type="number" step="any"></div>
  </div>
  <label>THB လက်ခံမယ့် အကောင့်</label><textarea id="r_c" rows="2"></textarea>
  <label>MMK လက်ခံမယ့် အကောင့်</label><textarea id="r_d" rows="2"></textarea>
  <p><button onclick="saveRates()">Save</button> <span id="rmsg"></span></p></section>

 <section><h2>Orders</h2>
  <div class="row"><select id="flt" onchange="loadOrders()" style="width:auto">
   <option value="pending">စောင့်ဆိုင်း</option><option value="done">ပြီးစီး</option><option value="rejected">ပယ်ချ</option><option value="all">အားလုံး</option></select>
   <button class="alt" onclick="loadOrders()">Refresh</button></div>
  <div id="list"></div></section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://cegxxtfwphzpxeqsufqr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlZ3h4dGZ3cGh6cHhlcXN1ZnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MDI4NDcsImV4cCI6MjExMDk3ODg0N30.xi7bK0WbkkE1AX4l6czbnTozTjvUZTwqixMZ-b6Z0q8';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en',{maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = {pending:'စောင့်ဆိုင်း',done:'ပြီးစီး',rejected:'ပယ်ချ'};

async function login(){
 const {error}=await db.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
 $('lerr').textContent=error?error.message:'';if(!error)start();}
async function logout(){await db.auth.signOut();location.reload()}
async function start(){
 const {data}=await db.auth.getSession();if(!data.session)return;
 $('login').classList.add('hide');$('app').classList.remove('hide');
 loadRates();loadOrders();loadSummary();}

async function loadRates(){
 const {data}=await db.from('rates').select('*').eq('id',1).single();if(!data)return;
 $('r_a').value=data.thb_to_mmk;$('r_b').value=data.mmk_to_thb;$('r_c').value=data.pay_thb;$('r_d').value=data.pay_mmk;}
async function saveRates(){
 const {error}=await db.from('rates').update({thb_to_mmk:+$('r_a').value,mmk_to_thb:+$('r_b').value,
  pay_thb:$('r_c').value,pay_mmk:$('r_d').value,updated_at:new Date().toISOString()}).eq('id',1);
 $('rmsg').textContent=error?error.message:'သိမ်းပြီးပါပြီ';}

async function loadSummary(){
 const s=new Date();s.setHours(0,0,0,0);
 const {data}=await db.from('orders').select('direction,send_amount,receive_amount,status').gte('created_at',s.toISOString());
 const all=data||[],d=all.filter(o=>o.status==='done');
 const sum=(a,dir,k)=>a.filter(o=>o.direction===dir).reduce((t,o)=>t+Number(o[k]),0);
 $('sum').innerHTML=[
  ['Order စုစုပေါင်း',all.length],['စောင့်ဆိုင်း',all.filter(o=>o.status==='pending').length],['ပြီးစီး',d.length],
  ['လက်ခံရ THB',fmt(sum(d,'THB_MMK','send_amount'))],['ပေးချေ MMK',fmt(sum(d,'THB_MMK','receive_amount'))],
  ['လက်ခံရ MMK',fmt(sum(d,'MMK_THB','send_amount'))],['ပေးချေ THB',fmt(sum(d,'MMK_THB','receive_amount'))]
 ].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');}

async function loadOrders(){
 let q=db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
 if($('flt').value!=='all')q=q.eq('status',$('flt').value);
 const {data,error}=await q;
 if(error){$('list').textContent=error.message;return}
 $('list').innerHTML=data.length?'':'<p>Order မရှိပါ</p>';
 for(const o of data){
  const [a,b]=o.direction==='THB_MMK'?['THB','MMK']:['MMK','THB'];
  const el=document.createElement('div');el.className='card order';
  el.innerHTML=`<div class="row" style="justify-content:space-between"><b>${esc(o.order_no)}</b><span class="badge ${o.status}">${label[o.status]}</span></div>
   <div>${fmt(o.send_amount)} ${a} → <b>${fmt(o.receive_amount)} ${b}</b> (rate ${fmt(o.rate)})</div>
   <div>${esc(o.name)} · ${esc(o.phone)}</div>
   <div>လက်ခံ: ${esc(o.receive_method)} – ${esc(o.receive_account)}</div>
   <div class="slip"></div>
   <label>Note (customer ကို ပြမယ်)</label><input class="note" value="${esc(o.note)}">
   <div class="row" style="margin-top:8px"><button class="alt" data-a="slip">Slip ကြည့်</button>
    <button data-a="done">အတည်ပြု</button><button class="no" data-a="rejected">ပယ်ချ</button></div>`;
  el.querySelector('[data-a=slip]').onclick=async()=>{
   const {data:u}=await db.storage.from('slips').createSignedUrl(o.slip_path,300);
   el.querySelector('.slip').innerHTML=u?`<img src="${u.signedUrl}" alt="slip">`:'Slip မတွေ့ပါ'};
  for(const st of ['done','rejected'])el.querySelector(`[data-a=${st}]`).onclick=async()=>{
   if(!confirm(`${o.order_no} ကို ${label[st]} လုပ်မလား?`))return;
   await db.from('orders').update({status:st,note:el.querySelector('.note').value||null}).eq('id',o.id);
   loadOrders();loadSummary();};
  $('list').appendChild(el);}
}
start();
</script>
</body>
</html>
