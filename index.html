<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ဘတ် ⇄ ကျပ် ငွေလွှဲ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23f2b705%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22800%22>฿K</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--f:"Plus Jakarta Sans","Noto Sans Myanmar","Noto Sans Thai","Padauk","Myanmar Text",system-ui,sans-serif;--bg:#f6f7f6;--s:#fff;--ink:#14201e;--mut:#6b7c79;--line:#e0e7e5;--p:#0b5d55;--on:#fff;--g:#f2b705;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1716;--s:#15221f;--ink:#e9f3f1;--mut:#8fa8a4;--line:#26393a;--p:#3cd0be;--on:#06201d;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.app{max-width:440px;margin:0 auto;padding:12px 14px 18px}
header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--g);color:#2a2000;font:800 .72rem var(--f)}
.lgbox{position:relative}.fl{font-size:1.05rem;line-height:1}
.lgb{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--s);color:var(--mut);padding:4px 10px;border-radius:9px;font:inherit;font-size:.8rem;cursor:pointer}
.lgm{position:absolute;right:0;top:calc(100% + 6px);background:var(--s);border:1px solid var(--line);border-radius:12px;padding:4px;min-width:140px;z-index:30;box-shadow:0 10px 26px -12px rgba(0,0,0,.35)}
.lgm button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;cursor:pointer;text-align:left}.lgm button:hover{background:var(--bg)}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rates>div{background:var(--s);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.rates small{display:block;color:var(--mut);font-size:.74rem}.rates b{font:800 1.45rem/1.25 var(--f);color:var(--p)}
.sub{margin:6px 2px 0;color:var(--mut);font-size:.72rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:10px 0 12px}
.tabs button{border:0;background:none;padding:8px;font:600 .92rem var(--f);color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs .on{color:var(--p);border-color:var(--p)}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--s);color:var(--ink);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--p)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px;border-radius:8px;font:700 .88rem var(--f);color:var(--mut);cursor:pointer}
.seg .on{background:var(--s);color:var(--p)}
.amt{display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--s);padding:0 12px}
.amt:focus-within{border-color:var(--p)}
.amt input{border:0;background:none;font:800 1.5rem var(--f);padding:7px 0;min-width:0}.amt span{font-weight:700;color:var(--mut)}
.get{display:flex;justify-content:space-between;align-items:baseline;min-height:30px;padding:4px 2px;color:var(--mut);font-size:.85rem}
.get b{font:800 1.3rem var(--f);color:var(--p)}.get i{font-style:normal;font-size:.8rem;color:var(--mut)}
.pay{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:8px 11px;border-radius:10px;background:var(--s);border:1px dashed var(--line)}
.pay small{color:var(--mut);font-size:.72rem}.pay pre{margin:0;white-space:pre-wrap;font:600 .88rem/1.4 var(--f)}
.lb{display:block;color:var(--mut);font-size:.74rem;margin:10px 2px 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.two:first-of-type{margin-top:10px}
.ghost{border:1px solid var(--line);background:var(--s);color:var(--ink);padding:5px 11px;border-radius:9px;font:inherit;font-size:.8rem;cursor:pointer;flex:none}
.file{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 11px;border:1px dashed var(--line);border-radius:10px;background:var(--s);color:var(--mut);cursor:pointer;font-size:.88rem;overflow:hidden}
.file img{width:34px;height:34px;object-fit:cover;border-radius:6px}.file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:var(--p);color:var(--on);font:700 1rem var(--f);cursor:pointer}
.btn:disabled{opacity:.5}.row2{display:flex;gap:8px}.row2 .btn{width:auto;margin:0;padding:0 18px}
.badge{display:inline-block;padding:2px 11px;border-radius:99px;font-weight:700;font-size:.82rem}
.pending{background:#fff1cf;color:#7a5200}.done{background:#d3f2e3;color:#0a5c3a}.rejected{background:#fcdcd9;color:#8a1c14}
.st{margin-top:12px;padding:12px;border-radius:12px;background:var(--s);border:1px solid var(--line)}.st p{margin:6px 0}.st img{max-width:100%;border-radius:10px;margin-top:6px}
.ver{text-align:center;color:var(--mut);font-size:.7rem;margin:12px 0 0}
.amt+.amt{margin-top:8px}.rcv input{color:var(--p)}
.qrw{text-align:center;margin-top:10px}.qrw img{width:min(230px,70%);border-radius:12px;border:1px solid var(--line);cursor:zoom-in;background:#fff}.qrw small{display:block;color:var(--mut);font-size:.72rem;margin-top:4px}
.swal2-popup{font-family:var(--f)}.no{font:800 1.6rem var(--f);letter-spacing:1px;margin:6px 0}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><span class="mark">฿K</span><span data-t="title"></span></div>
 <div class="lgbox"></div></header>
<div class="rates"><div><small data-t="r1"></small><b id="r1">–</b></div><div><small data-t="r2"></small><b id="r2">–</b></div></div>
<p class="sub" id="minnote"></p>
<nav class="tabs" id="tabs"><button data-p="p1" class="on" data-t="tab1"></button><button data-p="p2" data-t="tab2"></button></nav>

<section id="p1">
 <div class="seg" id="seg"><button data-d="THB_MMK" class="on">THB → MMK</button><button data-d="MMK_THB">MMK → THB</button></div>
 <div class="amt"><input id="amt" type="number" inputmode="decimal" min="0" data-ph="amt"><span id="cur">THB</span></div>
 <div class="amt rcv"><input id="rcv" type="number" inputmode="decimal" min="0" data-ph="get"><span id="cur2">MMK</span></div>
 <div class="pay"><div><small data-t="payto"></small><pre id="payt"></pre></div><button class="ghost" id="cp" data-t="copy"></button></div>
 <div class="qrw" id="qrw" hidden><img id="qrimg" alt="QR"><small data-t="tapqr"></small></div>
 <div class="two"><input id="name" autocomplete="name" data-ph="name"><input id="phone" type="tel" autocomplete="tel" data-ph="phone"></div>
 <span class="lb" data-t="s1"></span>
 <label class="file" for="slip" style="margin-top:0"><img id="prev" alt="" hidden><span id="fn" data-t="pick"></span></label>
 <input id="slip" type="file" accept="image/*" hidden>
 <span class="lb" data-t="s2"></span>
 <div class="two" style="margin-top:0"><select id="method"></select><input id="acc" data-ph="acc"></div>
 <label class="file" for="qr"><img id="qprev" alt="" hidden><span id="qn" data-t="qrpick"></span></label>
 <input id="qr" type="file" accept="image/*" hidden>
 <button class="btn" id="submit" data-t="submit"></button>
</section>

<section id="p2" hidden>
 <div class="row2"><input id="ono" placeholder="TM-XXXXXX" style="text-transform:uppercase"><button class="btn" id="chk" data-t="checkbtn"></button></div>
 <div id="status"></div>
</section>
<p class="ver">v10</p>

my:{title:'ဘတ် ⇄ ကျပ် ငွေလွှဲ',r1:'ဘတ်ပေးရင်',r2:'ဘတ်ပြန်ယူရင်',per:'ကျပ် ၁ သိန်းလျှင် ဘတ်',border:'နယ်စပ်',minnote:'အနည်းဆုံး',min:'ကျပ်',tab1:'ငွေလွှဲမယ်',tab2:'Order စစ်မယ်',amt:'ပေးပို့မယ့် ပမာဏ',get:'သင်ရမယ့်ငွေ',payto:'ဒီအကောင့်ကို အရင်လွှဲပါ',copy:'ကူးယူ',copied:'ကူးပြီးပါပြီ',name:'အမည်',phone:'ဖုန်းနံပါတ်',recv:'ငွေလက်ခံမယ့်နေရာ',acc:'အကောင့်/နံပါတ်',pick:'ငွေလွှဲ slip ဓာတ်ပုံ ရွေးရန်',submit:'Order တင်မယ်',checkbtn:'စစ်မယ်',fill:'အချက်အလက်အားလုံး ဖြည့်ပြီး slip တင်ပါ',ok:'Order တင်ပြီးပါပြီ',keep:'ဒီနံပါတ်ကို မှတ်ထားပါ',pending:'စောင့်ဆိုင်းနေသည်',done:'ပြီးစီးပါပြီ',rejected:'ပယ်ချခံရသည်',nf:'Order မတွေ့ပါ',fail:'မအောင်မြင်ပါ၊ ပြန်ကြိုးစားပါ',minerr:'အနည်းဆုံး ကျပ် {n} ကစပြီး လုပ်ပေးပါမယ်',payout:'ငွေပြန်လွှဲ slip',norate:'Rate မရသေးပါ၊ page ကို refresh လုပ်ပါ',wait:'တင်နေသည်...',s1:'၁။ ငွေလွှဲ slip',s2:'၂။ ငွေလက်ခံမယ့် ဘဏ် QR / အကောင့်',qrpick:'လက်ခံမယ့် ဘဏ် QR ဓာတ်ပုံ ရွေးရန်',needAcc:'လက်ခံမယ့် အကောင့်နံပါတ် (သို့) QR ဓာတ်ပုံ တစ်ခုခု ထည့်ပါ',saveqr:'QR ကို သိမ်းရန်',tapqr:'နှိပ်ရင် ပုံကြီးကြည့်ပြီး သိမ်းလို့ရပါတယ်'},
en:{title:'THB ⇄ MMK Transfer',r1:'You give THB',r2:'You take THB',per:'THB per MMK 100,000',border:'Border',minnote:'Min',min:'MMK',tab1:'Transfer',tab2:'Check order',amt:'Amount to send',get:'You receive',payto:'Send your money to this account first',copy:'Copy',copied:'Copied',name:'Name',phone:'Phone',recv:'Receive to',acc:'Account / number',pick:'Choose payment slip photo',submit:'Place order',checkbtn:'Check',fill:'Fill in everything and attach the slip',ok:'Order placed',keep:'Keep this number',pending:'Pending',done:'Completed',rejected:'Rejected',nf:'Order not found',fail:'Failed, please try again',minerr:'Minimum is MMK {n}',payout:'Payout slip',norate:'Rates not loaded, please refresh',wait:'Uploading...',s1:'1. Payment slip',s2:'2. Receiving bank QR / account',qrpick:'Choose receiving bank QR photo',needAcc:'Enter the receiving account number or upload its QR',saveqr:'Save QR',tapqr:'Tap to enlarge and save'},
th:{title:'โอนเงิน บาท ⇄ จ๊าต',r1:'เมื่อคุณให้บาท',r2:'เมื่อคุณรับบาท',per:'บาทต่อ 100,000 จ๊าต',border:'ชายแดน',minnote:'ขั้นต่ำ',min:'จ๊าต',tab1:'โอนเงิน',tab2:'ตรวจสอบออเดอร์',amt:'จำนวนเงินที่ต้องการโอน',get:'คุณจะได้รับ',payto:'โอนเงินมาที่บัญชีนี้ก่อน',copy:'คัดลอก',copied:'คัดลอกแล้ว',name:'ชื่อ',phone:'เบอร์โทร',recv:'รับเงินที่',acc:'บัญชี / เบอร์',pick:'เลือกรูปสลิปการโอนเงิน',submit:'สั่งโอนเงิน',checkbtn:'ตรวจสอบ',fill:'กรอกข้อมูลให้ครบและแนบสลิป',ok:'สร้างออเดอร์แล้ว',keep:'กรุณาจดหมายเลขนี้ไว้',pending:'รอดำเนินการ',done:'เสร็จสิ้น',rejected:'ถูกปฏิเสธ',nf:'ไม่พบออเดอร์',fail:'ไม่สำเร็จ กรุณาลองใหม่',minerr:'ขั้นต่ำ {n} จ๊าต',payout:'สลิปการโอนคืน',norate:'ยังไม่ได้โหลดเรท กรุณารีเฟรชหน้า',wait:'กำลังอัปโหลด...',s1:'1. สลิปการโอนเงิน',s2:'2. QR / บัญชีที่รับเงิน',qrpick:'เลือกรูป QR บัญชีที่รับเงิน',needAcc:'กรอกเลขบัญชีที่รับเงิน หรืออัปโหลด QR',saveqr:'บันทึก QR',tapqr:'แตะเพื่อขยายและบันทึก'},
zh:{title:'泰铢 ⇄ 缅币 汇款',r1:'您付泰铢时',r2:'您收泰铢时',per:'每 100,000 缅币对应泰铢',border:'边境',minnote:'最低',min:'缅币',tab1:'汇款',tab2:'查询订单',amt:'汇款金额',get:'您将收到',payto:'请先转账到此账户',copy:'复制',copied:'已复制',name:'姓名',phone:'电话',recv:'收款方式',acc:'账号 / 号码',pick:'选择转账凭证图片',submit:'提交订单',checkbtn:'查询',fill:'请填写全部信息并上传凭证',ok:'订单已提交',keep:'请记住此订单号',pending:'待处理',done:'已完成',rejected:'已拒绝',nf:'未找到订单',fail:'失败，请重试',minerr:'最低 {n} 缅币起',payout:'打款凭证',norate:'汇率未加载，请刷新页面',wait:'上传中...',s1:'1. 转账凭证',s2:'2. 收款银行二维码 / 账号',qrpick:'选择收款银行二维码图片',needAcc:'请填写收款账号或上传二维码',saveqr:'保存二维码',tapqr:'点击放大并保存'}};
const M={THB_MMK:['KPay','Wave Pay','AYA Pay','Bank'],MMK_THB:['PromptPay','Thai bank account']};
const LG={my:{f:'🇲🇲',n:'မြန်မာ'},en:{f:'🇬🇧',n:'English'},th:{f:'🇹🇭',n:'ไทย'},zh:{f:'🇨🇳',n:'中文'}};
let L='my',R=null,D='THB_MMK',SRC='s';try{const s=localStorage.getItem('lang');if(LG[s])L=s}catch(e){}
const $=id=>document.getElementById(id),qa=s=>document.querySelectorAll(s);
const fmt=n=>Number(n).toLocaleString('en',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(icon,title)=>S.fire({toast:true,position:'top',icon,title,timer:1800,showConfirmButton:false});

function mountLang(){
 qa('.lgbox').forEach(b=>{
  b.innerHTML=`<button class="lgb" type="button"><span class="fl"></span><span>▾</span></button><div class="lgm" hidden>${Object.entries(LG).map(([k,v])=>`<button type="button" data-l="${k}"><span class="fl">${v.f}</span>${v.n}</button>`).join('')}</div>`;
  const m=b.querySelector('.lgm');
  b.firstElementChild.onclick=e=>{e.stopPropagation();m.hidden=!m.hidden};
  m.onclick=e=>{const x=e.target.closest('[data-l]');if(x)setLang(x.dataset.l)};
 });
 document.addEventListener('click',()=>qa('.lgm').forEach(m=>m.hidden=true));
}
function setLang(l){L=l;try{localStorage.setItem('lang',l)}catch(e){}
 document.documentElement.lang=l;qa('[data-t]').forEach(e=>e.textContent=T[l][e.dataset.t]);
 qa('[data-ph]').forEach(e=>e.placeholder=T[l][e.dataset.ph]);
 qa('.lgbox>button .fl').forEach(e=>e.textContent=LG[l].f);qa('.lgm').forEach(m=>m.hidden=true);
 const f=$('slip').files[0];if(f)$('fn').textContent=f.name;const q=$('qr').files[0];if(q)$('qn').textContent=q.name;note();calc();if($('status').innerHTML&&$('ono').value)checkOrder()}
function note(){if(R)$('minnote').textContent=`${T[L].per} · ${T[L].border} ${fmt(R.border_rate)} · ${T[L].minnote} ${fmt(R.min_mmk)} ${T[L].min}`}
function fillMethods(){$('method').innerHTML=M[D].map(m=>`<option>${m}</option>`).join('')}
function showQR(){$('qrimg').src=D==='THB_MMK'?QR.thb:QR.mmk;$('qrw').hidden=false}
const fwd=a=>D==='THB_MMK'?Math.round(a/R.give_rate*1e5):Math.round(a/1e5*R.take_rate*100)/100;
const back=g=>D==='THB_MMK'?Math.ceil(+(g*R.give_rate/1e5*100).toFixed(6))/100:Math.ceil(+(g/R.take_rate*1e5).toFixed(6));
function calc(){showQR();if(!R)return 0;const t=D==='THB_MMK';
 $('cur').textContent=t?'THB':'MMK';$('cur2').textContent=t?'MMK':'THB';
 $('payt').textContent=t?R.pay_thb:R.pay_mmk;
 if(SRC==='r'){const g=parseFloat($('rcv').value)||0;$('amt').value=g>0?back(g):''}
 else{const a=parseFloat($('amt').value)||0;$('rcv').value=a>0?fwd(a):''}
 return fwd(parseFloat($('amt').value)||0)}
async function load(){const {data}=await db.from('rates').select('*').eq('id',1).single();
 if(data){R=data;$('r1').textContent=fmt(R.give_rate);$('r2').textContent=fmt(R.take_rate);note();calc()}}
async function compress(f){try{const bm=await createImageBitmap(f),k=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
 c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',.82))}catch(e){return f}}

async function submitOrder(){
 const t=T[L],a=parseFloat($('amt').value),f=$('slip').files[0],v=['name','phone','acc'].map(i=>$(i).value.trim());
 if(!R)return S.fire({icon:'info',text:t.norate});
 if(!(a>0)||!v[0]||!v[1]||!f)return S.fire({icon:'warning',text:t.fill});
 const q=$('qr').files[0];
 if(!v[2]&&!q)return S.fire({icon:'warning',text:t.needAcc});
 const mmk=D==='THB_MMK'?calc():a;
 if(mmk<R.min_mmk)return S.fire({icon:'warning',text:t.minerr.replace('{n}',fmt(R.min_mmk))});
 $('submit').disabled=true;S.fire({title:t.wait,allowOutsideClick:false,showConfirmButton:false,didOpen:()=>Swal.showLoading()});
 try{
  const no='TM-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
  const b=await compress(f),ext=b.type==='image/png'?'png':b.type==='image/webp'?'webp':'jpg',path=`${no}.${ext}`;
  const up=await db.storage.from('slips').upload(path,b,{contentType:b.type||'image/jpeg'});
  if(up.error)throw new Error('slip: '+up.error.message);
  let qp=null;
  if(q){const qb=await compress(q),qe=qb.type==='image/png'?'png':qb.type==='image/webp'?'webp':'jpg';qp=`${no}-qr.${qe}`;
   const u2=await db.storage.from('slips').upload(qp,qb,{contentType:qb.type||'image/jpeg'});if(u2.error)throw new Error('qr: '+u2.error.message)}
  const {error}=await db.from('orders').insert({order_no:no,direction:D,send_amount:a,receive_amount:calc(),rate:D==='THB_MMK'?R.give_rate:R.take_rate,
   name:v[0],phone:v[1],receive_method:$('method').value,receive_account:v[2],slip_path:path,recv_qr_path:qp});
  if(error)throw new Error('order: '+error.message);
  try{localStorage.setItem('lo',no)}catch(e){}
  $('ono').value=no;
  S.fire({icon:'success',title:t.ok,html:`<div class="no">${no}</div><div>${t.keep}</div>`,showDenyButton:true,denyButtonText:t.copy,denyButtonColor:'#6b7c79'})
   .then(r=>{if(r.isDenied){navigator.clipboard?.writeText(no);toast('success',t.copied)}});
 }catch(e){S.fire({icon:'error',title:t.fail,text:e.message})}
 finally{$('submit').disabled=false}
}
async function checkOrder(){
 const t=T[L],no=$('ono').value.trim().toUpperCase();if(!no)return;
 const {data}=await db.rpc('get_order_status',{p_order_no:no}),o=data&&data[0];
 if(!o){$('status').innerHTML='';return S.fire({icon:'info',text:t.nf})}
 const [a,b]=o.direction==='THB_MMK'?['THB','MMK']:['MMK','THB'];
 const url=o.payout_slip_path?db.storage.from('payouts').getPublicUrl(o.payout_slip_path).data.publicUrl:'';
 $('status').innerHTML=`<div class="st"><span class="badge ${o.status}">${t[o.status]}</span>
  <p>${fmt(o.send_amount)} ${a} → <b>${fmt(o.receive_amount)} ${b}</b></p>
  ${o.note?`<p>${esc(o.note)}</p>`:''}
  ${url?`<small>${t.payout}</small><br><a href="${encodeURI(url)}" target="_blank" rel="noopener"><img src="${encodeURI(url)}" alt=""></a>`:''}</div>`}
function tab(p){qa('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('p1').hidden=p!=='p1';$('p2').hidden=p!=='p2';
 if(p==='p2'&&$('ono').value&&!$('status').innerHTML)checkOrder()}

qa('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.p));
qa('#seg button').forEach(b=>b.onclick=()=>{D=b.dataset.d;qa('#seg button').forEach(x=>x.classList.toggle('on',x===b));fillMethods();calc()});
$('qrimg').onclick=()=>S.fire({imageUrl:$('qrimg').src,imageAlt:'QR',showConfirmButton:false,showCloseButton:true,footer:`<a href="${$('qrimg').src}" download="qr.jpg">${T[L].saveqr}</a>`});
$('amt').oninput=()=>{SRC='s';calc()};$('rcv').oninput=()=>{SRC='r';calc()};$('submit').onclick=submitOrder;$('chk').onclick=checkOrder;
$('cp').onclick=()=>{navigator.clipboard?.writeText($('payt').textContent);toast('success',T[L].copied)};
$('qr').onchange=e=>{const f=e.target.files[0];if(f){$('qprev').src=URL.createObjectURL(f);$('qprev').hidden=false;$('qn').textContent=f.name}};
$('slip').onchange=e=>{const f=e.target.files[0];if(f){$('prev').src=URL.createObjectURL(f);$('prev').hidden=false;$('fn').textContent=f.name}};
mountLang();fillMethods();setLang(L);load();
try{const s=localStorage.getItem('lo');if(s)$('ono').value=s}catch(e){}
</script>
